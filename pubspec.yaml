name: a2t_offline
description: "Audio to Text with Android Speech Recognizer"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # File picker and storage
  file_picker: ^6.1.1  # Более стабильная версия
  path_provider: ^2.1.4

  # Permissions
  permission_handler: ^11.0.1  # Более стабильная версия

  # Audio recording
  record: ^5.0.1  # Стабильная версия

  # Speech recognition (обновленная)
  speech_to_text: ^7.2.0

  # DOCX generation
  docx_template: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/template.docx